<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Console Lab</title>
<desc id="desc">Terminal prompt and laboratory flask in muted violet.</desc>
<style>
  .outline{stroke:#F8F6FF}
  .prompt{stroke:#F8F6FF}
  @media (prefers-color-scheme: light){.outline{stroke:#29203B}.prompt{stroke:#29203B}}
</style>
<!-- Terminal: fully transparent interior -->
<path d="M47 70 H152 Q177 70 177 95 V116 M131 215 H47 Q22 215 22 190 V95 Q22 70 47 70" class="outline" stroke-width="11" stroke-linejoin="round"/>
<!-- Violet toolbar -->
<path d="M47 70 H152 Q177 70 177 95 V110 H22 V95 Q22 70 47 70Z" fill="#A78BFA"/>

<!-- Command prompt -->
<path d="M49 145 L70 166 L49 187" class="prompt" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M87 181 H111" class="prompt" stroke-width="12.5" stroke-linecap="round"/>
<!-- Flask: solid silhouette backdrop only inside the vessel to mask terminal behind it -->
<path d="M173 126 V158 Q173 163 169 170 L137 217 Q128 231 137 240 Q142 247 157 247 H219 Q235 247 240 235 Q243 226 237 217 L208 170 Q204 164 204 158 V126Z" fill="#241B36" fill-opacity="0"/>
<!-- Flask border -->
<path d="M174 127 V157 Q174 162 170 169 L138 216 Q128 230 139 238 Q145 244 158 244 H218 Q231 244 237 237 Q245 228 236 215 L208 170 Q204 163 204 158 V127" class="outline" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M168 127 H210" class="outline" stroke-width="13" stroke-linecap="round"/>
<!-- Violet fluid -->
<path d="M148 223 Q158 225 172 218 Q194 205 204 210 Q210 211 214 218 L226 235 Q222 238 216 238 H157 Q150 238 146 233Z" fill="#A78BFA"/>
<!-- Air bubbles -->

</svg>